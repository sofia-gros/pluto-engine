name: Release PlutoEngine

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Engine (All packages)
        run: bun run build

      - name: Package Standalone Bundles
        run: |
          mkdir -p release_assets
          cp packages/pluto/dist/pluto.global.min.js release_assets/
          cp packages/pluto/dist/pluto.esm.min.js release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for NPM Publish
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Strip workspace protocol for publishing
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Setting package dependency versions to ^$VERSION..."
          find packages -name "package.json" -exec sed -i "s/\"workspace:\*\"/\"^$VERSION\"/g" {} +

      - name: Publish to NPM
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "Publishing $dir..."
              (cd "$dir" && npm publish --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
