<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Swarm Survivors - Hardcore Skill Tree</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #030712;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
    .boss-warning {
      animation: pulse-red 0.8s infinite alternate;
    }
    @keyframes pulse-red {
      from { opacity: 0.3; transform: translate(-50%, 0) scale(0.98); }
      to { opacity: 1.0; transform: translate(-50%, 0) scale(1.02); }
    }
  </style>
</head>
<body class="text-slate-100">

<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <!-- Boss Warning Banner -->
  <div id="boss-alert" class="absolute top-14 left-1/2 -translate-x-1/2 bg-rose-950/90 border-2 border-rose-500 px-5 py-1.5 rounded-xl text-rose-200 font-black text-xs sm:text-sm tracking-widest hidden boss-warning z-20 pointer-events-none shadow-2xl">
    ⚠️ 強大ボス接近！ノックバック無効 ⚠️
  </div>

  <!-- In-Game HUD -->
  <div id="hud-top" class="absolute top-2 left-2 right-2 flex flex-col pointer-events-none gap-1.5 max-w-xl mx-auto z-10">
    <div class="flex items-center justify-between bg-slate-900/90 backdrop-blur border border-slate-700/80 px-3 py-1.5 rounded-xl text-white shadow-xl pointer-events-auto">
      <div class="flex items-center gap-2">
        <span id="player-lvl" class="font-black text-amber-400 text-xs sm:text-sm">Lv.1</span>
        <div class="w-20 sm:w-36 bg-slate-950 rounded-full h-2.5 overflow-hidden border border-slate-700">
          <div id="exp-bar" class="bg-gradient-to-r from-sky-400 to-cyan-300 h-full transition-all duration-75" style="width: 0%"></div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div id="game-timer" class="text-sm sm:text-base font-black text-amber-300 tracking-wider font-mono">10:00</div>
        <div class="flex items-center gap-1 text-yellow-400 font-bold text-xs sm:text-sm">
          <span>🪙</span><span id="run-coins">0</span>
        </div>
        <div class="text-[10px] text-slate-400 font-mono">
          <span id="horde-count">0</span> 体
        </div>
      </div>
    </div>
    <!-- HP Bar (Fragile: dies in seconds if cornered) -->
    <div class="w-full bg-slate-900/80 backdrop-blur border border-slate-700/70 p-1 rounded-lg flex items-center gap-2">
      <span class="text-[10px] font-black text-rose-400 pl-1">HP</span>
      <div class="flex-1 bg-slate-950 rounded-full h-2 overflow-hidden border border-rose-950">
        <div id="hp-bar" class="bg-gradient-to-r from-rose-600 to-rose-400 h-full transition-all duration-75" style="width: 100%"></div>
      </div>
      <span id="hp-text" class="text-[9px] font-mono text-rose-300 pr-1">40/40</span>
    </div>
  </div>

  <!-- Virtual Joystick (Mobile) -->
  <div id="joystick-base" class="absolute w-28 h-28 rounded-full border-2 border-cyan-400/40 bg-cyan-950/25 backdrop-blur pointer-events-none hidden z-20">
    <div id="joystick-thumb" class="absolute w-10 h-10 rounded-full bg-cyan-400/80 shadow-lg shadow-cyan-400/50 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
  </div>

  <!-- Level Up Modal -->
  <div id="levelup-modal" class="absolute inset-0 bg-black/80 backdrop-blur-md hidden flex-col items-center justify-center p-4 z-30 pointer-events-auto">
    <div class="max-w-sm w-full bg-slate-900 border-2 border-amber-500/80 rounded-2xl p-4 shadow-2xl flex flex-col gap-3 text-white">
      <div class="text-center">
        <span class="text-[10px] font-bold text-amber-400 tracking-widest uppercase">Level Up!</span>
        <h2 class="text-lg font-black text-amber-300">スキル強化を選択</h2>
      </div>
      <div id="skill-choices" class="flex flex-col gap-2"></div>
    </div>
  </div>

  <!-- INTERACTIVE NODE SKILL TREE MODAL -->
  <div id="tree-modal" class="absolute inset-0 bg-slate-950/98 hidden flex-col z-40 text-white pointer-events-auto">
    <!-- Top Header -->
    <div class="flex items-center justify-between px-4 py-2 bg-slate-900/90 border-b border-slate-800 z-10">
      <div>
        <h1 id="tree-modal-title" class="text-base sm:text-lg font-black text-rose-500">SURVIVAL FAILED</h1>
        <p id="tree-modal-sub" class="text-[10px] sm:text-xs text-slate-400">生存時間: 00:00 | ドラッグで移動、ピンチ/ホイールでズーム</p>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1.5 bg-slate-950 border border-amber-500/60 px-3 py-1 rounded-xl">
          <span class="text-base">🪙</span>
          <span id="total-coins" class="text-sm sm:text-base font-black text-amber-400">0</span>
        </div>
        <button id="btn-tree-restart" class="px-4 py-1.5 bg-gradient-to-r from-amber-500 to-yellow-400 text-slate-950 font-black text-xs sm:text-sm rounded-xl shadow-lg shadow-amber-500/30 hover:brightness-110 active:scale-95 transition-all">
          出撃 ⚔️
        </button>
      </div>
    </div>

    <!-- Tree Interactive Viewport (Canvas) -->
    <div class="relative flex-1 w-full h-full overflow-hidden bg-[#030712]">
      <canvas id="tree-canvas" class="w-full h-full"></canvas>

      <!-- Zoom & Center Controls Floating on Tree Canvas -->
      <div class="absolute bottom-20 right-4 flex flex-col gap-2 z-10">
        <button id="btn-tree-zoom-in" class="w-9 h-9 rounded-xl bg-slate-800/90 border border-slate-700 text-slate-200 font-black text-lg flex items-center justify-center active:scale-90 shadow-lg">＋</button>
        <button id="btn-tree-zoom-out" class="w-9 h-9 rounded-xl bg-slate-800/90 border border-slate-700 text-slate-200 font-black text-lg flex items-center justify-center active:scale-90 shadow-lg">－</button>
        <button id="btn-tree-reset" class="w-9 h-9 rounded-xl bg-slate-800/90 border border-slate-700 text-slate-300 font-bold text-xs flex items-center justify-center active:scale-90 shadow-lg">原点</button>
      </div>

      <!-- Selected Node Inspector Floating Card -->
      <div id="node-inspector" class="absolute bottom-4 left-4 right-4 sm:right-auto sm:w-80 bg-slate-900/95 border border-slate-700 p-3 rounded-2xl shadow-2xl backdrop-blur hidden flex-col gap-2 z-10">
        <div class="flex items-start justify-between">
          <div>
            <div id="inspector-cat" class="text-[9px] font-black uppercase tracking-wider text-amber-400">CATEGORY</div>
            <h3 id="inspector-title" class="text-sm font-black text-white">ノード名</h3>
          </div>
          <span id="inspector-level" class="text-xs font-mono font-bold text-cyan-400">Lv.0/5</span>
        </div>
        <p id="inspector-desc" class="text-xs text-slate-300 leading-snug">効果説明文</p>
        <div class="flex items-center justify-between pt-1 border-t border-slate-800">
          <span id="inspector-cost" class="text-xs font-mono font-bold text-amber-300">🪙 10</span>
          <button id="btn-node-upgrade" class="px-3 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-lg active:scale-95 transition-all">
            習得 / 強化
          </button>
        </div>
      </div>
    </div>
  </div>
</div>


<script type="module" src="./main.ts"></script></body></html>
